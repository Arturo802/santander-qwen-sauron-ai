server:
  port: 8080

spring:
  application:
    name: sauron-backend

  # Configuración de Oracle Database (Conectando a la PDB por defecto FREEPDB1)
  datasource:
    url: jdbc:oracle:thin:@localhost:1521/FREEPDB1
    username: SYSTEM
    password: SauronSecure2026!
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        # --- NUEVA: Optimización para Inserciones por Lotes (Batch Inserts) ---
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true
        # ---------------------------------------------------------------------

  # Configuración de Apache Kafka
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: sauron-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer