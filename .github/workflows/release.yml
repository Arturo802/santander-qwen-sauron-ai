#
# Publish to PyPI on GitHub Release using OIDC trusted publishing.
# No long-lived PYPI_TOKEN is required: configure the project on PyPI under
# "Manage publishing" → "Trusted publishers" with this repo, this workflow
# file name (`release.yml`) and environment name (`pypi`).
#
# The publish job only runs when the repository variable `PYPI_PUBLISH` is
# set to `true` (Settings → Secrets and variables → Actions → Variables).
# Set it after the PyPI trusted publisher is configured; until then a GitHub
# Release only builds and attaches the distributions.

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
      - name: Install build
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build distributions
        run: python -m build
      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: [build]
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/gen-fraud-graph
    permissions:
      id-token: write  # OIDC for PyPI trusted publishing
      contents: read
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: dist/
          print-hash: true
